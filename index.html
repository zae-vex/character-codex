<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loadout // Character Codex</title>
<style>
  :root{
    --bg: #0c0e14;
    --bg-panel: #12151f;
    --bg-card: #171b28;
    --line: #262c40;
    --text: #e8eaf2;
    --text-dim: #8a90a8;
    --fortnite: #7c5cff;
    --marvel: #ff3b5c;
    --minecraft: #5ecb63;
    --gold: #ffc94d;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
  }

  body::before{
    content:"";
    position: fixed; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  header{
    position: relative; z-index: 1;
    text-align:center;
    padding: 64px 20px 40px;
    border-bottom: 1px solid var(--line);
  }

  .eyebrow{
    font-family: 'Courier New', monospace;
    letter-spacing: 0.35em;
    font-size: 12px;
    color: var(--gold);
    margin-bottom: 14px;
  }

  h1{
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(38px, 7vw, 72px);
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--fortnite), var(--marvel) 50%, var(--minecraft));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    line-height: 1.05;
  }

  header p{
    color: var(--text-dim);
    margin-top: 14px;
    font-size: 15px;
    max-width: 520px;
    margin-left:auto; margin-right:auto;
  }

  .tabs{
    position: relative; z-index: 1;
    display:flex;
    justify-content:center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 28px 20px;
  }

  .tab{
    font-family: 'Courier New', monospace;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 10px 20px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .tab:hover{ color: var(--text); border-color: #3a4262; }

  .tab.active[data-game="fortnite"]{ background: var(--fortnite); color:#fff; border-color: var(--fortnite); }
  .tab.active[data-game="marvel"]{ background: var(--marvel); color:#fff; border-color: var(--marvel); }
  .tab.active[data-game="minecraft"]{ background: var(--minecraft); color:#0c0e14; border-color: var(--minecraft); }
  .tab.active[data-game="all"]{ background: var(--gold); color:#0c0e14; border-color: var(--gold); }

  main{
    position: relative; z-index: 1;
    max-width: 1180px;
    margin: 0 auto;
    padding: 10px 20px 100px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card{
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    display:flex;
    flex-direction: column;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .card:hover{ transform: translateY(-4px); border-color: #454e70; }

  .card-top{
    height: 130px;
    display:flex; align-items:center; justify-content:center;
    font-size: 54px;
    position: relative;
  }
  .card[data-game="fortnite"] .card-top{
